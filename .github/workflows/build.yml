name: Build & Release Hideout (.app)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bump version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/bump-version.sh "${GITHUB_REF_NAME}"

      - name: Build (ad-hoc, no signing)
        run: >
          xcodebuild -project 'Hideout.xcodeproj'
          -scheme 'Hideout'
          -configuration Release-Direct
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build

      # Ad-hoc signing ("-" identity, no Apple cert): keeps every Mach-O in the
      # bundle valid for Homebrew installs (brew does not quarantine cask
      # downloads, so Gatekeeper never runs — no Developer ID signature needed)
      # and avoids "damaged app" on Apple Silicon.
      - name: Ad-hoc sign app bundle
        run: |
          APP="build/Build/Products/Release-Direct/Hideout.app"
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=1 "$APP" 2>&1 | head -5

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release-Direct/Hideout.app" \
            "Hideout.app.zip"

      - name: Verify app.zip
        run: |
          ls -la Hideout.app.zip
          file Hideout.app.zip

      - name: Create DMG
        run: |
          rm -rf dmg
          mkdir -p dmg

          cp -R \
            "build/Build/Products/Release-Direct/Hideout.app" \
            "dmg/Hideout.app"

          ln -s /Applications "dmg/Applications"

          hdiutil create \
            -volname "Hideout" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "Hideout.dmg"

          rm -rf dmg

      - name: Verify dmg
        run: |
          ls -la Hideout.dmg
          file Hideout.dmg

      - name: Create source archive
        run: |
          git archive \
            --format=zip \
            --output="Hideout-source.zip" \
            HEAD

      - name: Verify source archive
        run: |
          ls -la Hideout-source.zip
          file Hideout-source.zip

      - name: Upload test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Hideout-direct-${{ github.sha }}
          path: |
            Hideout.app.zip
            Hideout.dmg
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Hideout.app.zip
            Hideout.dmg
            Hideout-source.zip
          # A pushed v* tag publishes as a full release.
          generate_release_notes: true

      # Every v* tag gets the cask pinned to the exact version + artifact
      # sha256 and committed to master, so tap users can
      # `brew update && brew upgrade hideout`. Tag builds start from
      # the tag itself, not from master, hence the explicit HEAD:master push.
      - name: Pin cask version + sha256
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA256=$(shasum -a 256 "Hideout.app.zip" | cut -d' ' -f1)
          python3 .github/scripts/update-cask.py "${TAG}" "${VERSION}" "${SHA256}"

      - name: Commit updated cask
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hideout.rb
          if git diff --cached --quiet; then
            echo "Cask unchanged; nothing to commit."
          else
            git commit -m "ci: pin cask hideout to ${GITHUB_REF_NAME}"
            git push origin HEAD:master
          fi
