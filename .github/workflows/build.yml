name: Build & Release Hideout (.app)

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bump version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/bump-version.sh "${GITHUB_REF_NAME}"

      - name: Build (ad-hoc, no signing)
        run: >
          xcodebuild -project 'Hideout.xcodeproj'
          -scheme 'Hideout'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/Hideout.app" \
            "Hideout.app.zip"

      - name: Verify app.zip
        run: |
          ls -la Hideout.app.zip
          file Hideout.app.zip

      - name: Create DMG
        run: |
          rm -rf dmg
          mkdir -p dmg

          cp -R \
            "build/Build/Products/Release/Hideout.app" \
            "dmg/Hideout.app"

          ln -s /Applications "dmg/Applications"

          hdiutil create \
            -volname "Hideout" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "Hideout.dmg"

          rm -rf dmg

      - name: Verify dmg
        run: |
          ls -la Hideout.dmg
          file Hideout.dmg

      - name: Create source archive
        run: |
          git archive \
            --format=zip \
            --output="Hideout-source.zip" \
            HEAD

      - name: Verify source archive
        run: |
          ls -la Hideout-source.zip
          file Hideout-source.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Hideout.app.zip
            Hideout.dmg
            Hideout-source.zip
          prerelease: true
