name: Build & Release Hideout (.app)

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bump version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/bump-version.sh "${GITHUB_REF_NAME}"

      - name: Build (ad-hoc, no signing)
        run: >
          xcodebuild -project 'Hideout.xcodeproj'
          -scheme 'Hideout'
          -configuration Release-Direct
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build

      - name: Package app
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          APP_ZIP="Hideout.app.zip"
          APP_ZIP_VERSIONED="Hideout.app_${SUFFIX}.zip"
          DMG="Hideout.dmg"
          DMG_VERSIONED="Hideout_${SUFFIX}.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release-Direct/Hideout.app" \
            "$APP_ZIP"
          cp "$APP_ZIP" "$APP_ZIP_VERSIONED"
          {
            echo "APP_ZIP=$APP_ZIP"
            echo "APP_ZIP_VERSIONED=$APP_ZIP_VERSIONED"
            echo "DMG=$DMG"
            echo "DMG_VERSIONED=$DMG_VERSIONED"
          } >> "$GITHUB_ENV"

      - name: Verify app.zip
        run: |
          ls -la "$APP_ZIP" "$APP_ZIP_VERSIONED"
          file "$APP_ZIP_VERSIONED"

      - name: Create DMG
        run: |
          rm -rf dmg
          mkdir -p dmg

          cp -R \
            "build/Build/Products/Release-Direct/Hideout.app" \
            "dmg/Hideout.app"

          ln -s /Applications "dmg/Applications"

          hdiutil create \
            -volname "Hideout" \
            -srcfolder "dmg" \
            -ov \
            -format UDZO \
            "$DMG"
          cp "$DMG" "$DMG_VERSIONED"

          rm -rf dmg

      - name: Verify dmg
        run: |
          ls -la "$DMG" "$DMG_VERSIONED"
          file "$DMG_VERSIONED"

      - name: Create source archive
        run: |
          git archive \
            --format=zip \
            --output="Hideout-source.zip" \
            HEAD

      - name: Verify source archive
        run: |
          ls -la Hideout-source.zip
          file Hideout-source.zip

      - name: Upload test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Hideout-direct-${{ github.sha }}
          path: |
            ${{ env.APP_ZIP }}
            ${{ env.APP_ZIP_VERSIONED }}
            ${{ env.DMG }}
            ${{ env.DMG_VERSIONED }}
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_ZIP }}
            ${{ env.APP_ZIP_VERSIONED }}
            ${{ env.DMG }}
            ${{ env.DMG_VERSIONED }}
            Hideout-source.zip
          # Test tags (vX.Y.Z-goldengate-test) publish as prereleases;
          # clean vX.Y.Z tags publish as full releases.
          prerelease: ${{ contains(github.ref, 'goldengate-test') }}
          generate_release_notes: true
