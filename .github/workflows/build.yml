name: Build & Release Hideout (.app)

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/bump-version.sh "${GITHUB_REF_NAME}"

      - name: Build (ad-hoc, no signing)
        run: >
          xcodebuild -project 'Hideout.xcodeproj'
          -scheme 'Hideout'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build

      - name: Build direct (native visibility, no signing)
        run: >
          xcodebuild -project 'Hideout.xcodeproj'
          -scheme 'Hideout'
          -configuration Release-Direct
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build-direct

      # Keep the .app bundle intact (the previous upload flattened it to Contents/).
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release/Hideout.app" "Hideout.app.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hideout.app
          path: Hideout.app.zip

      # Auto-publish a release only when a version tag is pushed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Hideout.app.zip
          prerelease: true
